<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Блокдень" />
<meta http-equiv="Cache-Control" content="no-cache" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>Блокдень</title>
<style>
  :root { --ink:#24180f; --ui:#f6e7cb; --edge:#6b4a2a; --good:#2f9d57; --safe-b:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:ui-rounded,"Trebuchet MS",sans-serif; color:var(--ink); background:linear-gradient(#8fd4f2,#c6ecb0 72%); }
  button { font:inherit; cursor:pointer; touch-action:manipulation; }
  #app { min-height:100dvh; max-width:520px; margin:0 auto; padding:20px 14px calc(22px + var(--safe-b)); }
  .hud,.card,.portal,.chip { background:var(--ui); border:3px solid var(--edge); border-radius:10px; box-shadow:4px 4px 0 rgba(36,24,15,.22); }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px; margin-bottom:12px; }
  .hud button { min-height:44px; }
  h1 { margin:8px 0 4px; font-size:36px; }
  .build { margin:0 0 8px; font-weight:800; color:#2f6f62; }
  .days { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin:8px 0 12px; }
  .chip { padding:8px 12px; white-space:nowrap; font-weight:800; }
  .chip.on { background:#24180f; color:#f6e7cb; }
  .portals { display:flex; gap:8px; margin:12px 0; }
  .portal { flex:1; padding:10px 6px; text-align:center; min-height:108px; }
  .cube { height:54px; border-radius:8px; border:3px solid var(--ink); display:grid; place-items:center; color:#fff; font-weight:900; margin-bottom:6px; }
  .math { background:#3d7ea6; } .eng { background:#e0902e; } .other { background:#7a6bb5; }
  .card { padding:12px; margin:10px 0; }
  .tag { font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#6b4a2a; }
  .btn { background:var(--good); color:#fff; border:3px solid #1e6b38; border-radius:8px; padding:11px 14px; font-weight:800; }
  .btn.alt { background:#e7c48a; color:var(--ink); border-color:var(--edge); }
  .choice,.word { display:block; width:100%; text-align:left; margin:6px 0; background:#fffaf1; border:3px solid var(--edge); border-radius:8px; padding:10px; font-weight:800; min-height:44px; }
  .choice.good { background:#d9f5d4; } .choice.bad { background:#ffd9d4; }
  .slots { display:flex; flex-wrap:wrap; gap:6px; min-height:42px; margin:8px 0; }
  .slot { background:#fff; border:3px solid var(--ink); border-radius:6px; padding:6px 8px; font-weight:800; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const BUILD = "збірка 4";
const SEED = {"days":[]};
const saveKey = "blokden-progress-v1";
let world = SEED, mode = "home", track = "math", qi = 0, hearts = 3, built = [], locked = false, dayIndex = 0;
let progress = JSON.parse(localStorage.getItem(saveKey) || '{"xp":0,"done":{},"dayId":""}');
function save() { localStorage.setItem(saveKey, JSON.stringify(progress)); }
function day() { return world.days[dayIndex] || world.days[0]; }
function label(d) {
  if (!d) return "день";
  if (d.demo) return "приклад";
  const [y,m,dd] = String(d.date||"").split("-");
  const months = ["січ","лют","бер","квіт","трав","черв","лип","серп","вер","жовт","лист","груд"];
  return dd && m ? `${Number(dd)} ${months[Number(m)-1]||m}` : (d.date||"день");
}
function doneKey(i) { return `${day().id}:${track}:${i}`; }
function doneCount(name) {
  const d = day(); if (!d) return 0;
  return (d[name]||[]).filter((_,i) => progress.done[`${d.id}:${name}:${i}`]).length;
}
async function loadWorld() {
  try {
    const res = await fetch("./quests.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) { const data = await res.json(); if (data.days?.length) world = data; }
  } catch (e) {}
  const saved = world.days.findIndex(d => d.id === progress.dayId);
  dayIndex = saved >= 0 ? saved : 0;
  render();
}
function render() {
  const root = document.getElementById("app");
  const d = day();
  const hud = `<div class="hud"><b>XP ${progress.xp||0}</b><span>${"♥".repeat(hearts)}${"♡".repeat(Math.max(0,3-hearts))}</span><button class="btn alt" id="refresh">Оновити</button></div>`;
  const chips = `<div class="days">${(world.days||[]).map((item,i) => `<button class="chip ${i===dayIndex?"on":""}" data-day="${i}">${label(item)}</button>`).join("")}</div>`;
  if (!d) { root.innerHTML = hud + "<p>Ще немає днів.</p>"; return; }
  if (mode === "home") {
    root.innerHTML = hud + `<p class="build">${BUILD}</p><h1>Блокдень</h1><p>Останній день відкривається сам. Старі лишаються в стрічці зверху.</p>${chips}<div class="card"><div class="tag">${label(d)}</div><p>${d.lesson||""}</p></div><div class="portals"><button class="portal" data-track="math"><div class="cube math">+ −</div>Математика<small>${doneCount("math")}/${(d.math||[]).length}</small></button><button class="portal" data-track="english"><div class="cube eng">Aa</div>English<small>${doneCount("english")}/${(d.english||[]).length}</small></button><button class="portal" data-track="other"><div class="cube other">?</div>Інші<small>${doneCount("other")}/${(d.other||[]).length}</small></button></div>`;
  } else if (mode === "ask") {
    const item = d[track][qi];
    const already = progress.done[doneKey(qi)];
    const body = item.type === "order"
      ? `<div class="slots">${built.map(w => `<span class="slot">${w}</span>`).join("") || "торкни слово"}</div>${item.words.filter(w => !built.includes(w)).map(w => `<button class="word" data-word="${w}">${w}</button>`).join("")}<button class="btn" id="check">Перевірити</button>`
      : item.choices.map((c,i) => `<button class="choice" data-pick="${i}">${c}</button>`).join("");
    root.innerHTML = hud + chips + `<div class="card"><div class="tag">${label(d)} · ${track} · ${qi+1}/${d[track].length}${already?" · вже було":""}</div><p>${item.q}</p>${body}<p id="fb"></p><button class="btn alt" id="back">Назад</button></div>`;
  } else {
    root.innerHTML = hud + chips + `<div class="card"><h1>Шар чистий</h1><p>Цей день лишається в стрічці. Можна повернутись пізніше.</p><button class="btn" id="back">До порталів</button></div>`;
  }
  document.getElementById("refresh").onclick = () => location.reload();
  const back = document.getElementById("back");
  if (back) back.onclick = () => { mode = "home"; hearts = 3; render(); };
  root.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { dayIndex = Number(b.dataset.day); progress.dayId = world.days[dayIndex].id; save(); mode = "home"; render(); });
  root.querySelectorAll("[data-track]").forEach(b => b.onclick = () => start(b.dataset.track));
  root.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pick(Number(b.dataset.pick)));
  root.querySelectorAll("[data-word]").forEach(b => b.onclick = () => { if (!locked) { built.push(b.dataset.word); render(); } });
  const check = document.getElementById("check");
  if (check) check.onclick = checkOrder;
}
function start(name) {
  track = name;
  if (!(day()[name] || []).length) { alert("На цей день цього порталу немає."); return; }
  qi = 0; built = []; locked = false; hearts = 3; mode = "ask"; render();
}
function markDone() {
  const key = doneKey(qi);
  if (!progress.done[key]) { progress.done[key] = true; progress.xp = (progress.xp||0) + 10; save(); }
}
function pick(index) {
  if (locked) return; locked = true;
  const item = day()[track][qi];
  document.querySelectorAll(".choice").forEach((b,i) => { if (i === item.answer) b.classList.add("good"); if (i === index && i !== item.answer) b.classList.add("bad"); });
  const fb = document.getElementById("fb");
  if (index === item.answer) { markDone(); fb.textContent = item.why; setTimeout(next, 700); }
  else { hearts--; fb.textContent = item.why; if (!hearts) setTimeout(() => { mode = "home"; render(); }, 800); else locked = false; const s = document.querySelector(".hud span"); if (s) s.textContent = "♥".repeat(hearts)+"♡".repeat(Math.max(0,3-hearts)); }
}
function checkOrder() {
  const item = day()[track][qi];
  const ok = built.join(" ") === item.answer.join(" ");
  document.getElementById("fb").textContent = ok ? item.why : "Не той порядок.";
  if (ok) { markDone(); setTimeout(next, 700); }
  else { hearts--; built = []; if (!hearts) setTimeout(() => { mode = "home"; render(); }, 800); else render(); }
}
function next() { qi++; built = []; locked = false; mode = qi >= day()[track].length ? "win" : "ask"; render(); }
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
loadWorld();
</script>
</body>
</html>
