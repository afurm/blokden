<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Блокдень" />
<meta http-equiv="Cache-Control" content="no-cache" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>Блокдень</title>
<style>
  :root { --ink:#24180f; --ui:#f6e7cb; --edge:#6b4a2a; --good:#2f9d57; --safe-b:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:ui-rounded,"Trebuchet MS",sans-serif; color:var(--ink); background:linear-gradient(#8fd4f2,#c6ecb0 72%); }
  button { font:inherit; cursor:pointer; touch-action:manipulation; }
  #app { min-height:100dvh; max-width:520px; margin:0 auto; padding:22px 18px calc(92px + var(--safe-b)); }
  .hud,.card,.portal { background:var(--ui); border:3px solid var(--edge); border-radius:16px; box-shadow:4px 4px 0 rgba(36,24,15,.16); }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; margin-bottom:18px; }
  h1 { margin:6px 0 4px; font-size:34px; }
  .build { margin:0; font-weight:800; color:#2f6f62; }
  .lead { margin:0 0 16px; line-height:1.4; }
  .when { margin:8px 0 16px; }
  .when b { display:block; font-size:28px; }
  .when span { color:#6b4a2a; font-weight:800; }
  .portals,.daygrid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:8px 0 18px; }
  .portal,.day { padding:16px 12px; text-align:center; min-height:108px; background:var(--ui); border:3px solid var(--edge); border-radius:16px; }
  .cube { height:54px; border-radius:12px; border:3px solid var(--ink); display:grid; place-items:center; color:#fff; font-weight:900; margin-bottom:10px; }
  .portal b,.portal small,.day small { display:block; }
  .portal small,.day small { margin-top:4px; font-weight:800; color:#6b4a2a; }
  .day { min-height:72px; background:#fffaf1; font-weight:800; }
  .day.on { background:#24180f; color:#f6e7cb; }
  .day.on small { color:#f6e7cb; }
  .card { padding:18px 16px; margin:16px 0; }
  .card p { margin:10px 0 0; line-height:1.45; font-size:17px; }
  .tag { display:block; margin-bottom:6px; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#6b4a2a; }
  .btn { background:var(--good); color:#fff; border:3px solid #1e6b38; border-radius:12px; padding:12px 16px; font-weight:800; }
  .btn.alt { background:#e7c48a; color:var(--ink); border-color:var(--edge); }
  .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:18px; }
  .choice { display:block; width:100%; text-align:left; margin:0 0 12px; background:#fffaf1; border:3px solid var(--edge); border-radius:12px; padding:14px 16px; font-weight:800; min-height:52px; }
  .choice.good { background:#d9f5d4; } .choice.bad { background:#ffd9d4; }
  .hint { background:#fff6d8; border-radius:12px; padding:12px 14px; margin-top:12px; line-height:1.4; }
  .bar { height:12px; background:#fff; border:3px solid var(--ink); border-radius:8px; overflow:hidden; margin:14px 0 8px; }
  .bar span { display:block; height:100%; background:#2f9d57; }
  .rank { font-weight:800; }
  #fb { min-height:1.2em; margin:14px 0 0; font-weight:800; }
  .menu { position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:min(520px,100%); display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:10px 14px calc(10px + var(--safe-b)); background:rgba(246,231,203,.96); border-top:3px solid var(--edge); }
  .menu button { min-height:48px; border:3px solid var(--edge); border-radius:12px; background:#fffaf1; font-weight:800; }
  .menu button.on { background:#24180f; color:#f6e7cb; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const BUILD = "збірка 12";
const RANKS = ["Новачок", "Шукач", "Будівельник", "Майстер блоку", "Хранитель днів"];
const WEEK = ["неділя","понеділок","вівторок","середа","четвер","п'ятниця","субота"];
function rank() {
  const xp = progress.xp || 0;
  const level = Math.floor(xp / 40) + 1;
  const into = xp % 40;
  return { xp, level, into, title: RANKS[Math.min(RANKS.length - 1, level - 1)] };
}
const saveKey = "blokden-progress-v1";
let world = {days:[]}, mode = "home", subjectIndex = 0, qi = 0, hearts = 3, locked = false, dayIndex = 0, hintLevel = 0;
let progress = JSON.parse(localStorage.getItem(saveKey) || '{"xp":0,"done":{},"dayId":""}');
function save() { localStorage.setItem(saveKey, JSON.stringify(progress)); }
function day() { return world.days[dayIndex] || world.days[0]; }
function subjects() { return day()?.subjects || []; }
function subject() { return subjects()[subjectIndex]; }
function parts(d) {
  const [y,m,dd] = String(d?.date||"").split("-").map(Number);
  const months = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
  const short = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
  const week = y ? WEEK[new Date(y, m-1, dd).getDay()] : "";
  return { title: dd ? `${dd} ${months[m-1]}` : "день", short: dd ? `${dd} ${short[m-1]}` : "день", week };
}
function doneKey(i) { return `${day().id}:${subject().id}:${i}`; }
function doneCount(s, d) {
  const dayId = (d || day()).id;
  return (s.items||[]).filter((_,i) => progress.done[`${dayId}:${s.id}:${i}`]).length;
}
function dayDone(d) {
  const items = (d.subjects||[]).reduce((n,s) => n + (s.items||[]).length, 0);
  const done = (d.subjects||[]).reduce((n,s) => n + doneCount(s, d), 0);
  return { done, items };
}
function pickDay(index) {
  if (!world.days[index]) return;
  dayIndex = index;
  progress.dayId = world.days[dayIndex].id;
  save();
  mode = "home";
  hearts = 3;
  render();
}
async function loadWorld() {
  try {
    const res = await fetch("./quests.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) { const data = await res.json(); if (data.days?.length) world = data; }
  } catch (e) {}
  const saved = world.days.findIndex(d => d.id === progress.dayId);
  dayIndex = saved >= 0 ? saved : 0;
  render();
}
function menu() {
  if (mode === "ask" || mode === "win") return "";
  const tab = (id, name) => `<button class="${mode===id?"on":""}" data-tab="${id}">${name}</button>`;
  return `<nav class="menu">${tab("home","Головна")}${tab("days","Дні")}${tab("progress","Прогрес")}</nav>`;
}
function render() {
  const root = document.getElementById("app");
  const d = day();
  const r = rank();
  const hud = `<div class="hud"><div><b>Рівень ${r.level}</b><div class="rank">${r.title}</div></div><span>${"♥".repeat(hearts)}${"♡".repeat(Math.max(0,3-hearts))}</span><button class="btn alt" id="refresh">Оновити</button></div>`;
  if (!d) { root.innerHTML = hud + "<p>Ще немає днів.</p>" + menu(); bind(); return; }
  const p = parts(d);
  if (mode === "home") {
    const portals = subjects().map((s,i) => `<button class="portal" data-subject="${i}"><div class="cube" style="background:${s.color||"#6b4a2a"}">${doneCount(s)===(s.items||[]).length && s.items.length ? "★" : (s.mark||s.name.slice(0,2))}</div><b>${s.name}</b><small>${doneCount(s)} / ${(s.items||[]).length}</small></button>`).join("");
    root.innerHTML = hud + `<p class="build">${BUILD}</p><h1>Блокдень</h1><div class="when"><b>${p.title}</b><span>${p.week}</span></div><div class="portals">${portals}</div><div class="card"><p>${d.lesson||""}</p></div>` + menu();
  } else if (mode === "days") {
    const days = (world.days||[]).map((item,i) => {
      const info = dayDone(item);
      return `<button class="day ${i===dayIndex?"on":""}" data-day="${i}">${parts(item).short}<small>${parts(item).week}<br>${info.done} / ${info.items}</small></button>`;
    }).join("");
    root.innerHTML = hud + `<h1>Дні</h1><p class="lead">Обери день, і відкриються його предмети.</p><div class="daygrid">${days}</div>` + menu();
  } else if (mode === "progress") {
    const rows = (world.days||[]).map(item => {
      const info = dayDone(item);
      return `<p>${parts(item).title}: ${info.done} / ${info.items}</p>`;
    }).join("");
    root.innerHTML = hud + `<h1>Прогрес</h1><div class="bar"><span style="width:${(r.into/40)*100}%"></span></div><p class="tag">XP ${r.xp} · серія ${progress.streak||0} · до наступного ${40-r.into}</p><div class="card">${rows}</div>` + menu();
  } else if (mode === "ask") {
    const s = subject();
    const item = s.items[qi];
    const choices = (item.choices||[]).map((c,i) => `<button class="choice" data-pick="${i}">${c}</button>`).join("");
    const hints = (item.hints||[]).slice(0, hintLevel).map((h,i) => `<div class="hint">Підказка ${i+1}: ${h}</div>`).join("");
    const hintBtn = hintLevel < (item.hints||[]).length ? `<button class="btn alt" id="hint">Підказка ${hintLevel+1} / ${item.hints.length}</button>` : "";
    root.innerHTML = hud + `<div class="card"><div class="tag">${p.title} · ${s.name} · ${qi+1} / ${s.items.length}</div><p>${item.q}</p>${choices}${hints}<p id="fb"></p><div class="actions">${hintBtn}<button class="btn alt" id="back">Назад</button></div></div>`;
  } else {
    root.innerHTML = hud + `<div class="card"><h1>Шар чистий</h1><p>${subject().name} за цей день пройдено. +15 XP за портал.</p><button class="btn" id="back">До предметів</button></div>`;
  }
  bind();
}
function bind() {
  const refresh = document.getElementById("refresh");
  if (refresh) refresh.onclick = () => location.replace("./?v=" + Date.now());
  const back = document.getElementById("back");
  if (back) back.onclick = () => { mode = "home"; hearts = 3; render(); };
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { mode = b.dataset.tab; hearts = 3; render(); });
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => pickDay(Number(b.dataset.day)));
  document.querySelectorAll("[data-subject]").forEach(b => b.onclick = () => start(Number(b.dataset.subject)));
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pick(Number(b.dataset.pick)));
  const hint = document.getElementById("hint");
  if (hint) hint.onclick = () => { hintLevel++; render(); };
}
function start(index) {
  subjectIndex = index;
  if (!(subject().items||[]).length) return;
  qi = 0; hintLevel = 0; locked = false; mode = "ask"; render();
}
function markDone() {
  const key = doneKey(qi);
  if (!progress.done[key]) {
    progress.done[key] = true;
    progress.streak = (progress.streak || 0) + 1;
    let gain = Math.max(4, 10 - hintLevel * 2);
    if (progress.streak % 3 === 0) gain += 5;
    progress.xp = (progress.xp || 0) + gain;
    const s = subject();
    const portalKey = `${day().id}:${s.id}:portal`;
    if (!progress.done[portalKey] && doneCount(s) === (s.items || []).length) {
      progress.done[portalKey] = true;
      progress.xp += 15;
    }
    save();
  }
}
function miss(why) {
  hearts--;
  progress.streak = 0;
  save();
  const fb = document.getElementById("fb");
  if (fb) fb.textContent = hearts ? "Ще не те. Візьми підказку, вона не дає готову відповідь." : why;
  if (!hearts) setTimeout(() => { mode = "home"; render(); }, 900);
  else { locked = false; const s = document.querySelector(".hud span"); if (s) s.textContent = "♥".repeat(hearts)+"♡".repeat(Math.max(0,3-hearts)); }
}
function pick(index) {
  if (locked) return; locked = true;
  const item = subject().items[qi];
  document.querySelectorAll(".choice").forEach((b,i) => { if (i === item.answer) b.classList.add("good"); if (i === index && i !== item.answer) b.classList.add("bad"); });
  if (index === item.answer) { markDone(); document.getElementById("fb").textContent = item.why; setTimeout(next, 700); }
  else miss(item.why);
}
function next() { qi++; hintLevel = 0; locked = false; mode = qi >= subject().items.length ? "win" : "ask"; render(); }
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
loadWorld();
</script>
</body>
</html>
