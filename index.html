<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Блокдень" />
<meta http-equiv="Cache-Control" content="no-cache" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>Блокдень</title>
<style>
  :root { --ink:#24180f; --ui:#f6e7cb; --edge:#6b4a2a; --good:#2f9d57; --safe-b:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:ui-rounded,"Trebuchet MS",sans-serif; color:var(--ink); background:linear-gradient(#8fd4f2,#c6ecb0 72%); }
  button,select,input { font:inherit; cursor:pointer; touch-action:manipulation; }
  #app { min-height:100dvh; max-width:520px; margin:0 auto; padding:20px 14px calc(22px + var(--safe-b)); }
  .hud,.card,.portal { background:var(--ui); border:3px solid var(--edge); border-radius:10px; box-shadow:4px 4px 0 rgba(36,24,15,.22); }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px; margin-bottom:12px; }
  .hud button { min-height:44px; }
  h1 { margin:8px 0 4px; font-size:36px; }
  .build { margin:0 0 8px; font-weight:800; color:#2f6f62; }
  .picker { display:flex; gap:8px; align-items:center; margin:8px 0 12px; }
  .picker select,.picker input { flex:1; min-height:48px; background:#fffaf1; border:3px solid var(--ink); border-radius:10px; padding:8px 10px; font-weight:800; }
  .picker button { min-width:48px; min-height:48px; background:#e7c48a; border:3px solid var(--edge); border-radius:10px; font-weight:900; }
  .portals { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .portal { width:calc(50% - 4px); padding:10px 6px; text-align:center; min-height:108px; }
  .cube { height:54px; border-radius:8px; border:3px solid var(--ink); display:grid; place-items:center; color:#fff; font-weight:900; margin-bottom:6px; }
  .card { padding:12px; margin:10px 0; }
  .tag { font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#6b4a2a; }
  .btn { background:var(--good); color:#fff; border:3px solid #1e6b38; border-radius:8px; padding:11px 14px; font-weight:800; }
  .btn.alt { background:#e7c48a; color:var(--ink); border-color:var(--edge); }
  .choice { display:block; width:100%; text-align:left; margin:6px 0 0; background:#fffaf1; border:3px solid var(--edge); border-radius:8px; padding:10px; font-weight:800; min-height:44px; }
  .choice.good { background:#d9f5d4; } .choice.bad { background:#ffd9d4; }
  .hint { background:#fff6d8; border-radius:8px; padding:8px 10px; margin-top:8px; }
  .bar { height:12px; background:#fff; border:3px solid var(--ink); border-radius:8px; overflow:hidden; margin:8px 0; }
  .bar span { display:block; height:100%; background:#2f9d57; }
  .rank { font-weight:800; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const BUILD = "збірка 8";
const RANKS = ["Новачок", "Шукач", "Будівельник", "Майстер блоку", "Хранитель днів"];
function rank() {
  const xp = progress.xp || 0;
  const level = Math.floor(xp / 40) + 1;
  const into = xp % 40;
  return { xp, level, into, title: RANKS[Math.min(RANKS.length - 1, level - 1)] };
}
const saveKey = "blokden-progress-v1";
let world = {days:[]}, mode = "home", subjectIndex = 0, qi = 0, hearts = 3, locked = false, dayIndex = 0, hintLevel = 0;
let progress = JSON.parse(localStorage.getItem(saveKey) || '{"xp":0,"done":{},"dayId":""}');
function save() { localStorage.setItem(saveKey, JSON.stringify(progress)); }
function day() { return world.days[dayIndex] || world.days[0]; }
function subjects() {
  const d = day();
  if (!d) return [];
  if (d.subjects?.length) return d.subjects;
  return [];
}
function subject() { return subjects()[subjectIndex]; }
function label(d) {
  if (!d) return "день";
  const [y,m,dd] = String(d.date||"").split("-");
  const months = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
  return dd && m ? `${Number(dd)} ${months[Number(m)-1]||m}` : (d.date||"день");
}
function doneKey(i) { return `${day().id}:${subject().id}:${i}`; }
function doneCount(s) { return (s.items||[]).filter((_,i) => progress.done[`${day().id}:${s.id}:${i}`]).length; }
function pickDay(index) {
  if (!world.days[index]) return;
  dayIndex = index;
  progress.dayId = world.days[dayIndex].id;
  save();
  mode = "home";
  hearts = 3;
  render();
}
function pickByDate(value) {
  const exact = world.days.findIndex(d => d.date === value);
  if (exact >= 0) { pickDay(exact); return; }
  const dates = world.days.map(d => d.date).filter(Boolean).sort();
  const near = dates.find(d => d >= value) || dates[dates.length - 1];
  const index = world.days.findIndex(d => d.date === near);
  if (index >= 0) pickDay(index);
}
async function loadWorld() {
  try {
    const res = await fetch("./quests.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) { const data = await res.json(); if (data.days?.length) world = data; }
  } catch (e) {}
  const saved = world.days.findIndex(d => d.id === progress.dayId);
  dayIndex = saved >= 0 ? saved : 0;
  render();
}
function hintsHtml(item) {
  const hints = item.hints || [];
  const shown = hints.slice(0, hintLevel).map((h,i) => `<div class="hint">Підказка ${i+1}: ${h}</div>`).join("");
  const btn = hintLevel < hints.length ? `<button class="btn alt" id="hint">Підказка ${hintLevel+1} з ${hints.length}</button>` : "";
  return shown + btn;
}
function pickerHtml() {
  const d = day();
  const options = (world.days||[]).map((item,i) => `<option value="${i}" ${i===dayIndex?"selected":""}>${label(item)}</option>`).join("");
  const min = (world.days||[]).map(x => x.date).filter(Boolean).sort()[0] || "";
  const max = (world.days||[]).map(x => x.date).filter(Boolean).sort().slice(-1)[0] || "";
  return `<div class="picker"><button id="prev" type="button">‹</button><select id="daylist">${options}</select><input id="daydate" type="date" value="${d?.date||""}" min="${min}" max="${max}"><button id="next" type="button">›</button></div>`;
}
function render() {
  const root = document.getElementById("app");
  const d = day();
  const r = rank();
  const hud = `<div class="hud"><div><b>Рівень ${r.level}</b><div class="rank">${r.title}</div></div><span>${"♥".repeat(hearts)}${"♡".repeat(Math.max(0,3-hearts))}</span><button class="btn alt" id="refresh">Оновити</button></div><div class="bar"><span style="width:${(r.into/40)*100}%"></span></div><p class="tag">XP ${r.xp} · серія ${progress.streak||0} · до наступного ${40-r.into}</p>`;
  const picker = pickerHtml();
  if (!d) { root.innerHTML = hud + "<p>Ще немає днів.</p>"; bind(); return; }
  if (mode === "home") {
    const portals = subjects().map((s,i) => `<button class="portal" data-subject="${i}"><div class="cube" style="background:${s.color||"#6b4a2a"}">${doneCount(s)===(s.items||[]).length && s.items.length ? "★" : (s.mark||s.name.slice(0,2))}</div>${s.name}<small>${doneCount(s)}/${(s.items||[]).length}</small></button>`).join("");
    root.innerHTML = hud + `<p class="build">${BUILD}</p><h1>Блокдень</h1><p>Дату обирай у списку або коліщатком. Порожніх днів немає.</p>${picker}<div class="card"><div class="tag">${label(d)} · ${dayIndex+1}/${world.days.length}</div><p>${d.lesson||""}</p></div><div class="portals">${portals}</div>`;
  } else if (mode === "ask") {
    const s = subject();
    const item = s.items[qi];
    const choices = (item.choices||[]).map((c,i) => `<button class="choice" data-pick="${i}">${c}</button>`).join("");
    root.innerHTML = hud + picker + `<div class="card"><div class="tag">${s.name} · ${qi+1}/${s.items.length}</div><p>${item.q}</p>${choices}${hintsHtml(item)}<p id="fb"></p><button class="btn alt" id="back">Назад</button></div>`;
  } else {
    root.innerHTML = hud + picker + `<div class="card"><h1>Шар чистий</h1><p>${subject().name} за цей день пройдено. +15 XP за портал.</p><p class="rank">${rank().title}, рівень ${rank().level}</p><button class="btn" id="back">До предметів</button></div>`;
  }
  bind();
}
function bind() {
  const refresh = document.getElementById("refresh");
  if (refresh) refresh.onclick = () => location.reload();
  const back = document.getElementById("back");
  if (back) back.onclick = () => { mode = "home"; hearts = 3; render(); };
  const list = document.getElementById("daylist");
  if (list) list.onchange = () => pickDay(Number(list.value));
  const date = document.getElementById("daydate");
  if (date) date.onchange = () => pickByDate(date.value);
  const prev = document.getElementById("prev");
  if (prev) prev.onclick = () => pickDay(Math.max(0, dayIndex - 1));
  const next = document.getElementById("next");
  if (next) next.onclick = () => pickDay(Math.min(world.days.length - 1, dayIndex + 1));
  document.querySelectorAll("[data-subject]").forEach(b => b.onclick = () => start(Number(b.dataset.subject)));
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pick(Number(b.dataset.pick)));
  const hint = document.getElementById("hint");
  if (hint) hint.onclick = () => { hintLevel++; render(); };
}
function start(index) {
  subjectIndex = index;
  if (!(subject().items||[]).length) return;
  qi = 0; hintLevel = 0; locked = false; mode = "ask"; render();
}
function markDone() {
  const key = doneKey(qi);
  if (!progress.done[key]) {
    progress.done[key] = true;
    progress.streak = (progress.streak || 0) + 1;
    let gain = Math.max(4, 10 - hintLevel * 2);
    if (progress.streak % 3 === 0) gain += 5;
    progress.xp = (progress.xp || 0) + gain;
    const s = subject();
    const portalKey = `${day().id}:${s.id}:portal`;
    if (!progress.done[portalKey] && doneCount(s) === (s.items || []).length) {
      progress.done[portalKey] = true;
      progress.xp += 15;
    }
    save();
  }
}
function miss(why) {
  hearts--;
  progress.streak = 0;
  save();
  const fb = document.getElementById("fb");
  if (fb) fb.textContent = hearts ? "Ще не те. Візьми підказку, вона не дає готову відповідь." : why;
  if (!hearts) setTimeout(() => { mode = "home"; render(); }, 900);
  else { locked = false; const s = document.querySelector(".hud span"); if (s) s.textContent = "♥".repeat(hearts)+"♡".repeat(Math.max(0,3-hearts)); }
}
function pick(index) {
  if (locked) return; locked = true;
  const item = subject().items[qi];
  document.querySelectorAll(".choice").forEach((b,i) => { if (i === item.answer) b.classList.add("good"); if (i === index && i !== item.answer) b.classList.add("bad"); });
  if (index === item.answer) { markDone(); document.getElementById("fb").textContent = item.why; setTimeout(next, 700); }
  else miss(item.why);
}
function next() { qi++; hintLevel = 0; locked = false; mode = qi >= subject().items.length ? "win" : "ask"; render(); }
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
loadWorld();
</script>
</body>
</html>
