<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Блокдень" />
<meta http-equiv="Cache-Control" content="no-cache" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>Блокдень</title>
<style>
  :root { --ink:#24180f; --ui:#f6e7cb; --edge:#6b4a2a; --good:#2f9d57; --safe-b:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:ui-rounded,"Trebuchet MS",sans-serif; color:var(--ink); background:linear-gradient(#8fd4f2,#c6ecb0 72%); }
  button { font:inherit; cursor:pointer; touch-action:manipulation; }
  #app { min-height:100dvh; max-width:520px; margin:0 auto; padding:16px 14px calc(22px + var(--safe-b)); }
  .hud,.card,.portal,.daycard { background:var(--ui); border:3px solid var(--edge); border-radius:14px; box-shadow:4px 4px 0 rgba(36,24,15,.18); }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px; margin-bottom:10px; }
  .hud button { min-height:44px; }
  h1 { margin:4px 0; font-size:34px; }
  .build { margin:0; font-weight:800; color:#2f6f62; }
  .daycard { padding:10px; margin:10px 0; }
  .switch { display:grid; grid-template-columns:52px 1fr 52px; gap:8px; align-items:center; }
  .switch button,.fold { height:52px; background:#e7c48a; border:3px solid var(--edge); border-radius:12px; font-size:28px; font-weight:900; }
  .switch button:disabled { opacity:.35; }
  .when { text-align:center; }
  .when b { display:block; font-size:22px; }
  .when span { color:#6b4a2a; font-weight:800; }
  .fold { display:block; width:100%; height:44px; margin-top:10px; font-size:16px; }
  .daygrid { display:none; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .daygrid.open { display:grid; }
  .day { min-height:48px; background:#fffaf1; border:3px solid var(--edge); border-radius:12px; font-weight:800; }
  .day.on { background:#24180f; color:#f6e7cb; }
  .portals { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
  .portal { padding:10px 8px 12px; text-align:center; }
  .cube { height:52px; border-radius:10px; border:3px solid var(--ink); display:grid; place-items:center; color:#fff; font-weight:900; margin-bottom:8px; }
  .portal b,.portal small { display:block; }
  .portal small { margin-top:2px; font-weight:800; color:#6b4a2a; }
  .card { padding:12px; margin:10px 0; }
  .tag { font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#6b4a2a; }
  .btn { background:var(--good); color:#fff; border:3px solid #1e6b38; border-radius:10px; padding:11px 14px; font-weight:800; }
  .btn.alt { background:#e7c48a; color:var(--ink); border-color:var(--edge); }
  .choice { display:block; width:100%; text-align:left; margin:8px 0 0; background:#fffaf1; border:3px solid var(--edge); border-radius:10px; padding:12px; font-weight:800; min-height:48px; }
  .choice.good { background:#d9f5d4; } .choice.bad { background:#ffd9d4; }
  .hint { background:#fff6d8; border-radius:10px; padding:8px 10px; margin-top:8px; }
  .bar { height:12px; background:#fff; border:3px solid var(--ink); border-radius:8px; overflow:hidden; margin:8px 0; }
  .bar span { display:block; height:100%; background:#2f9d57; }
  .rank { font-weight:800; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const BUILD = "збірка 10";
const RANKS = ["Новачок", "Шукач", "Будівельник", "Майстер блоку", "Хранитель днів"];
const WEEK = ["неділя","понеділок","вівторок","середа","четвер","п'ятниця","субота"];
function rank() {
  const xp = progress.xp || 0;
  const level = Math.floor(xp / 40) + 1;
  const into = xp % 40;
  return { xp, level, into, title: RANKS[Math.min(RANKS.length - 1, level - 1)] };
}
const saveKey = "blokden-progress-v1";
let world = {days:[]}, mode = "home", subjectIndex = 0, qi = 0, hearts = 3, locked = false, dayIndex = 0, hintLevel = 0, daysOpen = false;
let progress = JSON.parse(localStorage.getItem(saveKey) || '{"xp":0,"done":{},"dayId":""}');
function save() { localStorage.setItem(saveKey, JSON.stringify(progress)); }
function day() { return world.days[dayIndex] || world.days[0]; }
function subjects() { return day()?.subjects || []; }
function subject() { return subjects()[subjectIndex]; }
function parts(d) {
  const [y,m,dd] = String(d?.date||"").split("-").map(Number);
  const months = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
  const short = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
  const week = y ? WEEK[new Date(y, m-1, dd).getDay()] : "";
  return { title: dd ? `${dd} ${months[m-1]}` : "день", short: dd ? `${dd} ${short[m-1]}` : "день", week };
}
function doneKey(i) { return `${day().id}:${subject().id}:${i}`; }
function doneCount(s) { return (s.items||[]).filter((_,i) => progress.done[`${day().id}:${s.id}:${i}`]).length; }
function pickDay(index) {
  if (!world.days[index]) return;
  dayIndex = index;
  progress.dayId = world.days[dayIndex].id;
  save();
  mode = "home";
  hearts = 3;
  daysOpen = false;
  render();
}
async function loadWorld() {
  try {
    const res = await fetch("./quests.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) { const data = await res.json(); if (data.days?.length) world = data; }
  } catch (e) {}
  const saved = world.days.findIndex(d => d.id === progress.dayId);
  dayIndex = saved >= 0 ? saved : 0;
  render();
}
function pickerHtml() {
  const p = parts(day());
  const buttons = (world.days||[]).map((item,i) => `<button class="day ${i===dayIndex?"on":""}" data-day="${i}">${parts(item).short}</button>`).join("");
  return `<div class="daycard"><div class="switch"><button id="prev" type="button" ${dayIndex===0?"disabled":""}>‹</button><div class="when"><b>${p.title}</b><span>${p.week}</span></div><button id="next" type="button" ${dayIndex===world.days.length-1?"disabled":""}>›</button></div><button class="fold" id="fold" type="button">${daysOpen?"Сховати дні":"Усі дні"}</button><div class="daygrid ${daysOpen?"open":""}">${buttons}</div></div>`;
}
function render() {
  const root = document.getElementById("app");
  const d = day();
  const r = rank();
  const hud = `<div class="hud"><div><b>Рівень ${r.level}</b><div class="rank">${r.title}</div></div><span>${"♥".repeat(hearts)}${"♡".repeat(Math.max(0,3-hearts))}</span><button class="btn alt" id="refresh">Оновити</button></div><div class="bar"><span style="width:${(r.into/40)*100}%"></span></div><p class="tag">XP ${r.xp} · серія ${progress.streak||0} · до наступного ${40-r.into}</p>`;
  if (!d) { root.innerHTML = hud + "<p>Ще немає днів.</p>"; bind(); return; }
  if (mode === "home") {
    const portals = subjects().map((s,i) => `<button class="portal" data-subject="${i}"><div class="cube" style="background:${s.color||"#6b4a2a"}">${doneCount(s)===(s.items||[]).length && s.items.length ? "★" : (s.mark||s.name.slice(0,2))}</div><b>${s.name}</b><small>${doneCount(s)} / ${(s.items||[]).length}</small></button>`).join("");
    root.innerHTML = hud + `<p class="build">${BUILD}</p><h1>Блокдень</h1>${pickerHtml()}<div class="card"><p>${d.lesson||""}</p></div><div class="portals">${portals}</div>`;
  } else if (mode === "ask") {
    const s = subject();
    const item = s.items[qi];
    const choices = (item.choices||[]).map((c,i) => `<button class="choice" data-pick="${i}">${c}</button>`).join("");
    const hints = (item.hints||[]).slice(0, hintLevel).map((h,i) => `<div class="hint">Підказка ${i+1}: ${h}</div>`).join("");
    const hintBtn = hintLevel < (item.hints||[]).length ? `<button class="btn alt" id="hint">Підказка ${hintLevel+1} / ${item.hints.length}</button>` : "";
    root.innerHTML = hud + `<div class="card"><div class="tag">${s.name} · ${qi+1} / ${s.items.length}</div><p>${item.q}</p>${choices}${hints}${hintBtn}<p id="fb"></p><button class="btn alt" id="back">Назад</button></div>`;
  } else {
    root.innerHTML = hud + `<div class="card"><h1>Шар чистий</h1><p>${subject().name} за цей день пройдено. +15 XP за портал.</p><button class="btn" id="back">До предметів</button></div>`;
  }
  bind();
}
function bind() {
  const refresh = document.getElementById("refresh");
  if (refresh) refresh.onclick = () => location.replace("./?v=" + Date.now());
  const back = document.getElementById("back");
  if (back) back.onclick = () => { mode = "home"; hearts = 3; render(); };
  const prev = document.getElementById("prev");
  if (prev) prev.onclick = () => pickDay(dayIndex - 1);
  const next = document.getElementById("next");
  if (next) next.onclick = () => pickDay(dayIndex + 1);
  const fold = document.getElementById("fold");
  if (fold) fold.onclick = () => { daysOpen = !daysOpen; render(); };
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => pickDay(Number(b.dataset.day)));
  document.querySelectorAll("[data-subject]").forEach(b => b.onclick = () => start(Number(b.dataset.subject)));
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pick(Number(b.dataset.pick)));
  const hint = document.getElementById("hint");
  if (hint) hint.onclick = () => { hintLevel++; render(); };
}
function start(index) {
  subjectIndex = index;
  if (!(subject().items||[]).length) return;
  qi = 0; hintLevel = 0; locked = false; daysOpen = false; mode = "ask"; render();
}
function markDone() {
  const key = doneKey(qi);
  if (!progress.done[key]) {
    progress.done[key] = true;
    progress.streak = (progress.streak || 0) + 1;
    let gain = Math.max(4, 10 - hintLevel * 2);
    if (progress.streak % 3 === 0) gain += 5;
    progress.xp = (progress.xp || 0) + gain;
    const s = subject();
    const portalKey = `${day().id}:${s.id}:portal`;
    if (!progress.done[portalKey] && doneCount(s) === (s.items || []).length) {
      progress.done[portalKey] = true;
      progress.xp += 15;
    }
    save();
  }
}
function miss(why) {
  hearts--;
  progress.streak = 0;
  save();
  const fb = document.getElementById("fb");
  if (fb) fb.textContent = hearts ? "Ще не те. Візьми підказку, вона не дає готову відповідь." : why;
  if (!hearts) setTimeout(() => { mode = "home"; render(); }, 900);
  else { locked = false; const s = document.querySelector(".hud span"); if (s) s.textContent = "♥".repeat(hearts)+"♡".repeat(Math.max(0,3-hearts)); }
}
function pick(index) {
  if (locked) return; locked = true;
  const item = subject().items[qi];
  document.querySelectorAll(".choice").forEach((b,i) => { if (i === item.answer) b.classList.add("good"); if (i === index && i !== item.answer) b.classList.add("bad"); });
  if (index === item.answer) { markDone(); document.getElementById("fb").textContent = item.why; setTimeout(next, 700); }
  else miss(item.why);
}
function next() { qi++; hintLevel = 0; locked = false; mode = qi >= subject().items.length ? "win" : "ask"; render(); }
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
loadWorld();
</script>
</body>
</html>
